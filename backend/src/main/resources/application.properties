# Database configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cmms}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# JPA/Hibernate configuration
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Enable SSL if required by your database
spring.datasource.ssl=true
spring.datasource.ssl.trustStore=/path/to/your/truststore.jks
spring.datasource.ssl.trustStorePassword=your_truststore_password

#Hikari Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5 
spring.datasource.hikari.idle-timeout=300000